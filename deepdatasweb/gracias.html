<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mensaje enviado | DeepDatas</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/brand/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/deepdatas.css" rel="stylesheet">
</head>

<body class="simple-page">

  <main class="simple-card">
    <a href="/" class="brand">
      <img src="/assets/img/brand/logo-mark-white.png" alt="" width="28" height="32">
      <span>DeepDatas</span>
    </a>

    <!-- Se muestra cuando la URL termina en #error -->
    <div id="error" class="simple-error">
      <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
      <h1>No pudimos enviar tu mensaje</h1>
      <p>Revisá los datos e intentá nuevamente, o escribinos directamente a <a href="mailto:contacto@deepdatas.com">contacto@deepdatas.com</a>.</p>
      <a class="btn-dd btn-dd-primary btn-dd-lg" href="/#contacto">Volver al formulario</a>
    </div>

    <div class="simple-ok">
      <i class="bi bi-check-circle" aria-hidden="true"></i>
      <h1>¡Gracias por escribirnos!</h1>
      <p>Recibimos tu mensaje y te responderemos a la brevedad.</p>
      <a class="btn-dd btn-dd-primary btn-dd-lg" href="/">Volver al inicio</a>
    </div>
  </main>

</body>

</html>
